name: Github Actions

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # x86-64 Linux, native backend
          - ubuntu-24.04-arm   # arm64 Linux, native backend
          - macos-latest       # arm64 macOS, native backend
          - windows-latest     # x86-64 Windows, native backend
          # x86-64 macOS is missing because setup-nim-action installs an
          # arm64 Nim on the Intel runners, which then refuse to start
          # with "Bad CPU type in executable". Put macos-15-intel back
          # once the action picks its download by architecture.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check out private Fixxy dependency
        uses: actions/checkout@v5
        with:
          repository: treeform/fixxy
          ref: e35b9b9f7bab725886ca1df1a0e35256cde9f93d
          path: .dependencies/fixxy
          ssh-key: ${{ secrets.FIXXY_DEPLOY_KEY }}
          persist-credentials: false
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p "$HOME/.nimby/pkgs"
          cp -R .dependencies/fixxy "$HOME/.nimby/pkgs/fixxy"
          cd ..
          nimby install -g "${{ github.event.repository.name }}/${{ github.event.repository.name }}.nimble"
          nimby sync -g "${{ github.event.repository.name }}/nimby.lock"
      - run: nim check src/bassy.nim
      - run: nim r tests/tests.nim
      - name: Test release execution
        run: nim r -d:release tests/tests.nim
      - name: Test explicit sandbox checks
        run: nim r -d:danger tests/tests.nim
      - name: Test Fixxy overflow checks
        run: nim r -d:fixedChecks tests/tests.nim
      - name: Test C++ determinism
        run: nim cpp -r -d:release tests/tests.nim
      - name: Test the machine code encoders against the system assembler
        run: |
          nim r -d:release tests/test_arm64.nim
          nim r -d:release tests/test_amd64.nim
      - name: Test compiled loops against the interpreter
        run: nim r -d:release tests/test_jit.nim
      - name: Test the same scripts with the interpreter forced
        run: nim r -d:release -d:bassyNoJit tests/test_jit.nim
      - name: Render the BASIC raytracer and check cross-platform determinism
        run: nim r -d:release tests/bench_raytracer.nim
      - name: Report native compilation speedups
        run: nim r -d:release tests/bench_jit.nim
      - name: Run examples
        run: |
          nim r examples/hello.nim
          nim r examples/hosts.nim
          nim r examples/strings.nim
          nim r examples/fixed.nim
          nim r examples/natural_strings.nim
